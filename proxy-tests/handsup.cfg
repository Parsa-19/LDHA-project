defaults 
    mode http

frontend http-requests
    bind *:80
    timeout client 60s

    http-request del-header Cache-Control
   
    default_backend allservers



backend allservers
    timeout connect 10s
    timeout server 100s
    balance leastconn
   
    server laravel-server 127.0.0.1:8001
    server django-server 127.0.0.1:8002
